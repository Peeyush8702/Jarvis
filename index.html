<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login</title>
  <style>
    /* Reset & background video styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    video#bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5); /* semi-transparent overlay */
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 40px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      border-radius: 10px;
      width: 400px;
      height: 350px;
      text-align: center;
      margin: auto;
      top: 50%;
      transform: translateY(-50%);
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .login-container label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-size: 14px;
      color: #333;
    }

    .login-container input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .login-container button {
      width: 100%;
      padding:15px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .login-container button:hover {
      background-color: #004494;
    }

    .error-message {
      color: red;
      margin-top: 10px;
      font-size: 14px;
    }

    @media (max-width: 400px) {
      .login-container {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video autoplay muted loop id="bg-video">
    <source src="https://videos.pexels.com/video-files/3163534/3163534-hd_1920_1080_30fps.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Overlay to darken video slightly -->
  <div class="overlay"></div>

  <!-- Login Form -->
  <div class="login-container">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />

      <button type="submit">Login</button>
      <div id="error" class="error-message"></div>
    </form>
  </div>

  <!-- JavaScript for simple validation -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const error = document.getElementById('error');

      // Demo credentials
      const adminUsername = 'admin';
      const adminPassword = 'password123';

      if (username === adminUsername && password === adminPassword) {
        alert('Login successful! Redirecting...');
        window.location.href = '/admin-dashboard.html'; // Update for your environment
      } else {
        error.textContent = 'Invalid username or password.';
      }
    });
  </script>
</body>
</html>
