<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SparkEd LMS Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f2027;
      --secondary: #203a43;
      --accent: #2c5364;
      --white: #ffffff;
      --text: #f0f0f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Poppins', sans-serif;
      height: 100%;
      overflow: hidden;
      color: var(--text);
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      background: rgba(0, 0, 0, 0.7);
      z-index: -1;
    }

    .container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      background: rgba(15, 32, 39, 0.85);
      color: white;
      display: flex;
      flex-direction: column;
      padding: 30px 20px;
      backdrop-filter: blur(6px);
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    .sidebar h2 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    .sidebar a {
      color: white;
      text-decoration: none;
      padding: 12px 15px;
      border-radius: 8px;
      margin: 8px 0;
      transition: all 0.3s ease;
      font-size: 16px;
    }

    .sidebar a:hover {
      background-color: rgba(255, 255, 255, 0.1);
      transform: translateX(5px);
    }

    .main {
      flex: 1;
      padding: 40px 30px;
      overflow-y: auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .top-bar h1 {
      font-size: 28px;
    }

    .user {
      font-size: 16px;
      color: #ccc;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 30px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    }

    .card h3 {
      font-size: 18px;
      color: #00aaff;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 16px;
      color: #e0e0e0;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .container {
        flex-direction: column;
      }

      .main {
        padding: 20px;
      }
    }
  </style>
</head>
<!-- Replace your previous HTML with this block for the student dashboard -->
<!-- Only the content inside <body> has changed; the styles and structure remain the same -->
<body>

  <!-- Background Video -->
  <video autoplay muted loop id="bg-video">
    <source src="https://videos.pexels.com/video-files/8733059/8733059-hd_1920_1080_30fps.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Dark overlay -->
  <div class="overlay"></div>

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h2>📚 SparkEd LMS</h2>
      <a href="#">🏠 Dashboard</a>
      <a href="my-courses.html">📖 My Courses</a>
      <a href="#">📝 Assignments</a>
      <a href="#">📊 Grades</a>
      <a href="#">💬 Discussions</a>
      <a href="index.html" onclick="return logout()">🚪 Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main">
      <div class="top-bar">
        <h1>Hello, Student!</h1>
        <div class="user">Status: Enrolled ✅</div>
      </div>

      <div class="cards" id="dashboardCards">
  	<!-- Cards will be dynamically injected here -->
	</div>

      </div>
    </div>
  </div>

  <script>
  async function loadDashboardData() {
    // Simulated API response - replace with real API call
    const data = {
      coursesEnrolled: 6,
      pendingAssignments: 3,
      overallGrade: "B+",
      newNotifications: 4
    };

    const cards = [
      { icon: "📚", title: "Courses Enrolled", value: data.coursesEnrolled },
      { icon: "📥", title: "Pending Assignments", value: data.pendingAssignments },
      { icon: "📊", title: "Overall Grade", value: data.overallGrade },
      { icon: "🔔", title: "Notifications", value: `${data.newNotifications} New` }
    ];

    const container = document.getElementById("dashboardCards");

    cards.forEach(card => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <h3>${card.icon} ${card.title}</h3>
        <p>${card.value}</p>
      `;
      container.appendChild(div);
    });
  }

  function logout() {
    alert("You have been logged out of SparkEd.");
    return true;
  }

  // Load data on page load
  window.onload = loadDashboardData;
</script>


</body>
</head>
</html>
